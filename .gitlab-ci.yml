image: mcr.microsoft.com/playwright:v1.61.0-jammy

stages:
  - test
  - report

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

variables:
  CI: "true"

before_script:
  - npm ci

test:
  stage: test
  script:
    - npx playwright install --with-deps chromium
    - npm run test
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 30 days

report:
  stage: report
  needs: [test]
  script:
    - npm install -g allure-commandline
    - allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 30 days
